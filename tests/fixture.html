<!doctype html><html><head><meta charset="utf-8"><title>Multiview playback fixture</title></head><body style="margin:0;background:black">
<div class="videoPlayerContainer"><video class="htmlvideoplayer" autoplay muted playsinline style="width:100vw;height:100vh"></video></div>
<script>
window.ApiClient = {
  getCurrentUserId: () => 'viewer', deviceId: () => 'browser', accessToken: () => 'test-token',
  getUrl: (path, query = {}) => new URL('/jellyfin/' + path.replace(/^\//, ''), location.origin).href + (Object.keys(query).length ? '?' + new URLSearchParams(query) : '')
};
const canvas = document.createElement('canvas'); canvas.width = 640; canvas.height = 360;
const context = canvas.getContext('2d'); let frame = 0;
setInterval(() => { context.fillStyle = '#126343'; context.fillRect(0, 0, 640, 360); context.fillStyle = 'white'; context.font = '32px sans-serif'; context.fillText('LIVE • ' + frame++, 180, 190); }, 33);
window.original = document.querySelector('video');
window.original.srcObject = canvas.captureStream(30);
window.original.play();
window.playbackEvents = [];
['pause', 'emptied', 'loadstart'].forEach(event => original.addEventListener(event, () => playbackEvents.push(event)));
</script><script defer src="/multiview.js"></script></body></html>
